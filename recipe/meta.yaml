{% set version = "2.0.1" %}

package:
  name: curated-tokenizers
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/curated-tokenizers/curated_tokenizers-{{ version }}.tar.gz
  sha256: 1c752df124f01961b734137adc316b354e5fa07a20696ef709e97b8ada1bd70f
  patches:
    - patches/0001-use-our-own-sentencepiece-abseil.patch

build:
  script: python -m pip install . -vv
  number: 0

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools
    - cython
    - libprotobuf
    - libsentencepiece
  run:
    - python
    - regex

test:
  requires:
    - pip
  imports:
    - curated_tokenizers
  commands:
    - pip check

about:
  home: https://github.com/explosion/curated-transformers
  summary: 'Lightweight piece tokenization library'
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/explosion/curated-tokenizers

extra:
  recipe-maintainers:
    - h-vetinari
    - conda-forge/spacy
